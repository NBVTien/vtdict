version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/NBVTien/vtdict/cmd.currentVersion={{.Tag}}
    binary: vtdict

archives:
  - format: binary
    name_template: "vtdict_{{ .Os }}_{{ .Arch }}"

release:
  github:
    owner: NBVTien
    name: vtdict

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
